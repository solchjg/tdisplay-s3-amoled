LZ</text><polyline points="720,110 720,190 750,190" fill="none" stroke="#333"/><rect x="930" y="190" width="130" height="60" rx="4" fill="none" stroke="#333"/><text x="995.0" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Shunt R2</text><text x="995.0" y="224" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">100 Ω 0.1 %</text><polyline points="995,150 995,190" fill="none" stroke="#333"/><circle cx="995" cy="172" r="3" fill="#333"/><rect x="750" y="280" width="130" height="170" rx="4" fill="none" stroke="#333"/><text x="815.0" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="#222">ADS1115</text><text x="815.0" y="314" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">0x49 (Adafruit 1085)</text><text x="760" y="334" text-anchor="start" font-size="12" font-weight="normal" fill="#222">VDD</text><text x="760" y="364" text-anchor="start" font-size="12" font-weight="normal" fill="#222">SDA</text><text x="760" y="399" text-anchor="start" font-size="12" font-weight="normal" fill="#222">SCL</text><text x="760" y="434" text-anchor="start" font-size="12" font-weight="normal" fill="#222">GND</text><text x="870" y="334" text-anchor="end" font-size="12" font-weight="normal" fill="#222">A0</text><text x="870" y="399" text-anchor="end" font-size="12" font-weight="normal" fill="#222">A1</text><polyline points="710,360 750,360" fill="none" stroke="#333"/><polyline points="710,395 750,395" fill="none" stroke="#333"/><polyline points="710,430 750,430" fill="none" stroke="#333"/><polyline points="815,230 815,260 730,260 730,330 750,330" fill="none" stroke="#333"/><polyline points="730,330 710,330" fill="none" stroke="#333"/><circle cx="730" cy="330" r="3" fill="#333"/><text x="820" y="254" text-anchor="start" font-size="11" font-weight="normal" fill="#555">3.25 V iso</text><polyline points="995,172 1080,172 1080,330 880,330" fill="none" stroke="#333"/><polyline points="995,250 995,395 880,395" fill="none" stroke="#333"/><text x="30" y="516" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Dashes: the isolation barrier. Board GND and 0 V iso never join; 0 V iso joins R2's low end, ADS1115 GND, GND2, U5 and the DC-DC's 0 V.</text><text x="30" y="534" text-anchor="start" font-size="12" font-weight="normal" fill="#222">The load switch, converter and DC-DC input return to board GND. GPIO 15/16 float while GPIO 3 is low.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="sans-serif" fill="#222"><rect width="1100" height="400" fill="#fff"/><rect x="30" y="60" width="180" height="120" rx="4" fill="none" stroke="#333"/><text x="120.0" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#222">ESP32-S3</text><text x="120.0" y="94" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">uplink_core decides</text><text x="120.0" y="108" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">what each note holds</text><text x="120.0" y="122" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">note.add over I2C,</text><text x="120.0" y="136" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">then deep sleep</text><rect x="270" y="60" width="180" height="120" rx="4" fill="none" stroke="#333"/><text x="360.0" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Notecard</text><text x="360.0" y="94" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">keeps notes in flash</text><text x="360.0" y="108" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">syncs every cell_every min</text><text x="360.0" y="122" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">(60 by default);</text><text x="360.0" y="136" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">sync:true at once</text><rect x="510" y="60" width="180" height="120" rx="4" fill="none" stroke="#333"/><text x="600.0" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Notehub</text><text x="600.0" y="94" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">Blues' cloud</text><text x="600.0" y="108" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">one event per note</text><text x="600.0" y="122" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">7-day retention</text><text x="600.0" y="136" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">(Essentials plan)</text><polyline points="210,120 270,120" fill="none" stroke="#333"/><text x="240" y="113" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">I2C</text><polyline points="450,120 510,120" fill="none" stroke="#333"/><text x="480" y="113" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">LTE</text><rect x="780" y="30" width="290" height="80" rx="4" fill="none" stroke="#333"/><text x="925.0" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#222">ThingsBoard</text><text x="925.0" y="64" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">tb.qo: up to 100 readings</text><text x="925.0" y="78" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">tbattr.qo: attributes, signal bars</text><rect x="780" y="130" width="290" height="60" rx="4" fill="none" stroke="#333"/><text x="925.0" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#222">ntfy server</text><text x="925.0" y="164" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">alert.qo, sync:true</text><rect x="780" y="210" width="290" height="60" rx="4" fill="none" stroke="#333"/><text x="925.0" y="228" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Mail service (HTTP API)</text><text x="925.0" y="244" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">mail.qo, only with cell_mail route</text><polyline points="690,120 735,120 735,70 780,70" fill="none" stroke="#333"/><polyline points="690,120 735,120 735,160 780,160" fill="none" stroke="#333"/><polyline points="690,120 735,120 735,240 780,240" fill="none" stroke="#333"/><circle cx="735" cy="120" r="3" fill="#333"/><circle cx="735" cy="160" r="3" fill="#333"/><text x="720" y="300" text-anchor="start" font-size="11" font-weight="normal" fill="#555">General HTTP routes, set up by the user in Notehub;</text><text x="720" y="314" text-anchor="start" font-size="11" font-weight="normal" fill="#555">tokens and API keys live in the routes, never in a note</text><rect x="30" y="260" width="420" height="70" rx="4" fill="none" stroke="#888"/><text x="240.0" y="278" text-anchor="middle" font-size="14" font-weight="600" fill="#888">Not over cellular</text><text x="240.0" y="294" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">status page, OTA, portal, mDNS, UDP log, SNTP:</text><text x="240.0" y="308" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">the ESP32-S3's own WiFi (or off, §34)</text><text x="30" y="362" text-anchor="start" font-size="12" font-weight="normal" fill="#222">A timer wake reads, adds its notes and sleeps within 10 s; the Notecard does the radio work afterwards.</text><text x="30" y="380" text-anchor="start" font-size="12" font-weight="normal" fill="#222">The route targets are reached from the internet, so LAN-only servers cannot receive over cellular (R-33).</text></svg>

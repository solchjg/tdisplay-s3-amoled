" cy="386" r="3" fill="#333"/><polyline points="625,386 625,206 640,206" fill="none" stroke="#333"/><text x="460" y="418" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">GND</text><rect x="900" y="60" width="160" height="200" rx="4" fill="none" stroke="#333"/><text x="980.0" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Instrument</text><text x="980.0" y="94" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">not known yet</text><text x="1050" y="124" text-anchor="end" font-size="12" font-weight="normal" fill="#222">RXD</text><text x="1050" y="154" text-anchor="end" font-size="12" font-weight="normal" fill="#222">TXD</text><text x="1050" y="184" text-anchor="end" font-size="12" font-weight="normal" fill="#222">CTS / RTS</text><text x="1050" y="214" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GND</text><polyline points="810,116 900,116" fill="none" stroke="#333"/><polyline points="810,146 900,146" fill="none" stroke="#333"/><polyline points="810,176 900,176" fill="none" stroke="#333" stroke-dasharray="6 4"/><polyline points="810,206 900,206" fill="none" stroke="#333"/><text x="855" y="104" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">cable</text><text x="935" y="290" text-anchor="start" font-size="11" font-weight="normal" fill="#555">Straight cable to a DCE,</text><text x="935" y="304" text-anchor="start" font-size="11" font-weight="normal" fill="#555">null-modem cable to a DTE.</text><text x="935" y="330" text-anchor="start" font-size="11" font-weight="normal" fill="#555">Dashed: optional RTS,</text><text x="935" y="344" text-anchor="start" font-size="11" font-weight="normal" fill="#555">held asserted while on.</text></svg>

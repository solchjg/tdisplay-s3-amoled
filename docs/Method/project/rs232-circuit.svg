<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="sans-serif" fill="#222"><rect width="1100" height="470" fill="#fff"/><rect x="20" y="20" width="520" height="420" rx="4" fill="#f4f8fc" stroke="#c8d6e5" stroke-dasharray="6 4"/><text x="30" y="38" text-anchor="start" font-size="11" font-weight="normal" fill="#555">3.3 V logic, unpowered while off</text><rect x="560" y="20" width="520" height="420" rx="4" fill="#fdf6ee" stroke="#e6d2b8" stroke-dasharray="6 4"/><text x="1070" y="38" text-anchor="end" font-size="11" font-weight="normal" fill="#555">RS232 levels, about ±5.5 V</text><rect x="40" y="60" width="170" height="330" rx="4" fill="none" stroke="#333"/><text x="125.0" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#222">LilyGO board</text><text x="200" y="124" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GPIO 13</text><text x="200" y="204" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GPIO 11 (TX)</text><text x="200" y="254" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GPIO 12 (RX)</text><text x="200" y="344" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GND</text><rect x="320" y="60" width="200" height="330" rx="4" fill="none" stroke="#333"/><text x="420.0" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#222">MAX3232</text><text x="420.0" y="94" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">U12, PDIP-16 in a socket</text><text x="330" y="124" text-anchor="start" font-size="12" font-weight="normal" fill="#222">16 VCC</text><text x="330" y="204" text-anchor="start" font-size="12" font-weight="normal" fill="#222">11 T1IN</text><text x="330" y="254" text-anchor="start" font-size="12" font-weight="normal" fill="#222">12 R1OUT</text><text x="330" y="344" text-anchor="start" font-size="12" font-weight="normal" fill="#222">15 GND</text><text x="510" y="204" text-anchor="end" font-size="12" font-weight="
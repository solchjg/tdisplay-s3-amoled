" height="110" rx="40" fill="#c96a3c" stroke="#6b3418" stroke-width="8"/><rect x="-125" y="-55" width="30" height="110" fill="#111111"/></g><text x="350" y="25" font-family="Droid Sans" font-size="60" text-anchor="middle" font-weight="bold" fill="#000000">1N5711</text><circle id="connector0pin" cx="50" cy="100" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><circle id="connector1pin" cx="650" cy="100" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/></g><g transform="translate(1800 900)"><line x1="50" y1="100" x2="650" y2="100" stroke="#a0a0a0" stroke-width="20"/><g transform="translate(350 100)"><rect x="-150" y="-55" width="300" height="110" rx="40" fill="#c96a3c" stroke="#6b3418" stroke-width="8"/><rect x="-125" y="-55" width="30" height="110" fill="#111111"/></g><text x="350" y="25" font-family="Droid Sans" font-size="60" text-anchor="middle" font-weight="bold" fill="#000000">1N5711</text><circle id="connector0pin" cx="50" cy="100" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><circle id="connector1pin" cx="650" cy="100" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/></g><polyline points="1400,800 1600,800 1600,650 1850,650" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1400,800 1600,800 1600,650 1850,650" fill="none" stroke="#ff7033" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="800" r="22" fill="#ff7033" stroke="#000000" stroke-width="6"/><circle cx="1850" cy="650" r="22" fill="#ff7033" stroke="#000000" stroke-width="6"/><polyline points="2450,650 2700,650 2700,950 3100,950" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="2450,650 2700,650 2700,950 3100,950" fill="none" stroke="#ff7033" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="2450" cy="650" r="22" fill="#ff7033" stroke="#000000" stroke-width="6"/><circle cx="3100" cy="950" r="22" fill="#ff7033" stroke="#000000" stroke-width="6"/><polyline points="1400,950 1650,950 1650,1000 1850,1000" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1400,950 1650,950 1650,1000 1850,1000" fill="none" stroke="#ffe24d" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="950" r="22" fill="#ffe24d" stroke="#000000" stroke-width="6"/><circle cx="1850" cy="1000" r="22" fill="#ffe24d" stroke="#000000" stroke-width="6"/><polyline points="2450,1000 2800,1000 2800,1050 3100,1050" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="2450,1000 2800,1000 2800,1050 3100,1050" fill="none" stroke="#ffe24d" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="2450" cy="1000" r="22" fill="#ffe24d" stroke="#000000" stroke-width="6"/><circle cx="3100" cy="1050" r="22" fill="#ffe24d" stroke="#000000" stroke-width="6"/><polyline points="1400,1100 1700,1100 1700,1150 3100,1150" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1400,1100 1700,1100 1700,1150 3100,1150" fill="none" stroke="#404040" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1400" cy="1100" r="22" fill="#404040" stroke="#000000" stroke-width="6"/><circle cx="3100" cy="1150" r="22" fill="#404040" stroke="#000000" stroke-width="6"/><rect x="200" y="3100" width="4600" height="780" fill="#fffbd6" stroke="#c9b458" stroke-width="10"/><text x="250" y="3210" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="bold" fill="#000000">FeatherS3D: the bench's BOOT and RST lines (FSD C-40.9)</text><text x="250" y="3295" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">On the board's long header: RST is the first pin (beside 3V3.1), GPIO 0 the third</text><text x="250" y="3380" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">(marked 0, the BOOT button's line), GND the fourth (white square). No wire to 3V3.1.</text><text x="250" y="3465" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">D1, D2: 1N5711 (or BAT43) Schottky, band (cathode) at the Pi. Pi low pulls the pin</text><text x="250" y="3550" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">to about 0.4 V; Pi high is blocked, so the board's pull-up holds the pin and the Pi</text><text x="250" y="3635" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">never powers the board. Pi pairs: 1 BCM 17/18 (pins 11/12), 2 BCM 22/23 (15/16),</text><text x="250" y="3720" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">3 BCM 24/25 (18/22), 4 BCM 26/27 (37/13); GND pin 14. Then run the BOOT/EN test.</text><text x="250" y="3805" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">Title bars: green = firmware on main; blue = in the FSD, not built yet; orange = proposed, not in the FSD.</text></svg>

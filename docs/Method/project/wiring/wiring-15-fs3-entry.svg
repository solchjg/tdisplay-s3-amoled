<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="720" viewBox="0 0 6400 4000"><rect x="0" y="0" width="6400" height="4000" fill="#ffffff"/><text x="150" y="200" font-family="Droid Sans" font-size="120" text-anchor="start" font-weight="bold" fill="#000000">15  FeatherS3D: field cable entry, surge protection and earth (FSD 40)</text><g transform="translate(300 800)"><rect x="0" y="0" width="1200" height="1185" rx="40" fill="#6d4c41" stroke="#111111" stroke-width="12"/><rect x="0" y="0" width="1200" height="280" rx="40" fill="#1565c0"/><text x="600.0" y="100" font-family="Droid Sans" font-size="72" text-anchor="middle" font-weight="bold" fill="#ffffff">Field cable</text><text x="600.0" y="190" font-family="Droid Sans" font-size="58" text-anchor="middle" font-weight="normal" fill="#ffffff">shielded twisted pair</text><text x="1140" y="397" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">wire 1</text><circle id="connector0pin" cx="1200" cy="375" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1140" y="547" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">wire 2</text><circle id="connector1pin" cx="1200" cy="525" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1140" y="697" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">wire 3</text><circle id="connector2pin" cx="1200" cy="675" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1140" y="847" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">wire 4</text><circle id="connector3pin" cx="1200" cy="825" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1140" y="997" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">shield</text><circle id="connector4pin" cx="1200" cy="975" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="600.0" y="1145" font-family="Droid Sans" font-size="50" text-anchor="middle" font-weight="normal" fill="#e0e0e0">15 - 100 ft, buried conduit</text></g><g transform="translate(2500 800)"><rect x="0" y="0" width="1300" height="1185" rx="40" fill="#37474f" stroke="#111111" stroke-width="12"/><rect x="0" y="0" width="1300" height="280" rx="40" fill="#1565c0"/><text x="650.0" y="100" font-family="Droid Sans" font-size="72" text-anchor="middle" font-weight="bold" fill="#ffffff">Surge protector</text><text x="650.0" y="190" font-family="Droid Sans" font-size="58" text-anchor="middle" font-weight="normal" fill="#ffffff">GDT, series R/PTC, TVS</text><text x="60" y="397" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">L1 in</text><circle id="connector0pin" cx="0" cy="375" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="60" y="547" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">L2 in</text><circle id="connector1pin" cx="0" cy="525" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="60" y="697" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">L3 in</text><circle id="connector2pin" cx="0" cy="675" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="60" y="847" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">L4 in</text><circle id="connector3pin" cx="0" cy="825" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="60" y="997" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">EARTH</text><circle id="connector4pin" cx="0" cy="975" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1240" y="397" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">L1 out</text><circle id="connector5pin" cx="1300" cy="375" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1240" y="547" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">L2 out</text><circle id="connector6pin" cx="1300" cy="525" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1240" y="697" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">L3 out</text><circle id="connector7pin" cx="1300" cy="675" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1240" y="847" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">L4 out</text><circle id="connector8pin" cx="1300" cy="825" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="1240" y="997" font-family="Droid Sans" font-size="60" text-anchor="end" font-weight="normal" fill="#ffffff">EARTH</text><circle id="connector9pin" cx="1300" cy="975" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="650.0" y="1145" font-family="Droid Sans" font-size="50" text-anchor="middle" font-weight="normal" fill="#e0e0e0">at the enclosure wall</text></g><g transform="translate(4800 800)"><rect x="0" y="0" width="1100" height="960" rx="40" fill="#37474f" stroke="#111111" stroke-width="12"/><rect x="0" y="0" width="1100" height="280" rx="40" fill="#1565c0"/><text x="550.0" y="100" font-family="Droid Sans" font-size="72" text-anchor="middle" font-weight="bold" fill="#ffffff">Isolated board</text><text x="550.0" y="190" font-family="Droid Sans" font-size="58" text-anchor="middle" font-weight="normal" fill="#ffffff">field terminals</text><text x="60" y="397" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">T1</text><circle id="connector0pin" cx="0" cy="375" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="60" y="547" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">T2</text><circle id="connector1pin" cx="0" cy="525" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="60" y="697" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">T3</text><circle id="connector2pin" cx="0" cy="675" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/><text x="60" y="847" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">T4</text><circle id="connector3pin" cx="0" cy="825" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/></g><g transform="translate(4800 2400)"><rect x="0" y="0" width="1000" height="510" rx="40" fill="#4e342e" stroke="#111111" stroke-width="12"/><rect x="0" y="0" width="1000" height="280" rx="40" fill="#1565c0"/><text x="500.0" y="100" font-family="Droid Sans" font-size="72" text-anchor="middle" font-weight="bold" fill="#ffffff">Earth rod</text><text x="500.0" y="190" font-family="Droid Sans" font-size="58" text-anchor="middle" font-weight="normal" fill="#ffffff">one per station</text><text x="60" y="397" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#ffffff">rod</text><circle id="connector0pin" cx="0" cy="375" r="30" fill="#d4af37" stroke="#8a6d1c" stroke-width="10"/></g><polyline points="1500,1175 2500,1175" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1500,1175 2500,1175" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1500" cy="1175" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="2500" cy="1175" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="3800,1175 4800,1175" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="3800,1175 4800,1175" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="3800" cy="1175" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="4800" cy="1175" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="1500,1325 2500,1325" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1500,1325 2500,1325" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1500" cy="1325" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="2500" cy="1325" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="3800,1325 4800,1325" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="3800,1325 4800,1325" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="3800" cy="1325" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="4800" cy="1325" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="1500,1475 2500,1475" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1500,1475 2500,1475" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1500" cy="1475" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="2500" cy="1475" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="3800,1475 4800,1475" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="3800,1475 4800,1475" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="3800" cy="1475" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="4800" cy="1475" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="1500,1625 2500,1625" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1500,1625 2500,1625" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1500" cy="1625" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="2500" cy="1625" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="3800,1625 4800,1625" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="3800,1625 4800,1625" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="3800" cy="1625" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><circle cx="4800" cy="1625" r="22" fill="#ffffff" stroke="#000000" stroke-width="6"/><polyline points="1500,1775 2500,1775" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1500,1775 2500,1775" fill="none" stroke="#999999" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="1500" cy="1775" r="22" fill="#999999" stroke="#000000" stroke-width="6"/><circle cx="2500" cy="1775" r="22" fill="#999999" stroke="#000000" stroke-width="6"/><polyline points="3800,1775 4300,1775 4300,2775 4800,2775" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/><polyline points="3800,1775 4300,1775 4300,2775 4800,2775" fill="none" stroke="#47cc79" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle cx="3800" cy="1775" r="22" fill="#47cc79" stroke="#000000" stroke-width="6"/><circle cx="4800" cy="2775" r="22" fill="#47cc79" stroke="#000000" stroke-width="6"/><rect x="300" y="3300" width="5800" height="695" fill="#fffbd6" stroke="#c9b458" stroke-width="10"/><text x="350" y="3410" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="bold" fill="#000000">FeatherS3D build: each field cable's entry (FSD C-40.5 - C-40.8)</text><text x="350" y="3495" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">Every field line (the loop pair, the probe's three wires, the MaxBotix's four) passes a</text><text x="350" y="3580" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">protector at the enclosure wall: a gas discharge tube to earth, then a series resistor</text><text x="350" y="3665" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">or PTC, then a TVS sized for its line (24 V supplies, 5 V signals). The protectors share</text><text x="350" y="3750" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">one earth rod by a short, heavy conductor. The shield is bonded at this end only.</text><text x="350" y="3835" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">Then the isolated board (sheet 13 or 14): 3 kV between the field and the board's ground.</text><text x="350" y="3920" font-family="Droid Sans" font-size="60" text-anchor="start" font-weight="normal" fill="#000000">Title bars: green = firmware on main; blue = in the FSD, not built yet; orange = proposed, not in the FSD.</text></svg>

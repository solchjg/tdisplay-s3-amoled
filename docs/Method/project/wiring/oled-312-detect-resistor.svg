<line x1="400" y1="105" x2="400" y2="615" stroke="#0d2a63" stroke-width="10"/>
<text x="400" y="640" font-size="17" fill="#333" text-anchor="middle">board edge</text>
<rect x="476" y="522" width="40" height="40" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="542" r="7" fill="#8a8a8a"/>
<text x="496" y="548" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="549" font-size="18" fill="#ffffff" text-anchor="start">1 GND</text>
<circle cx="440" cy="542" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="542" r="7" fill="#8a8a8a"/>
<text x="440" y="548" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="549" font-size="18" fill="#222" text-anchor="end">2 VCC</text>
<circle cx="496" cy="486" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="486" r="7" fill="#8a8a8a"/>
<text x="496" y="492" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="493" font-size="18" fill="#ffffff" text-anchor="start">3 NC</text>
<circle cx="440" cy="486" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="486" r="7" fill="#8a8a8a"/>
<text x="440" y="492" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="493" font-size="18" fill="#222" text-anchor="end">4 SCLK</text>
<circle cx="496" cy="430" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="430" r="7" fill="#8a8a8a"/>
<text x="496" y="436" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="437" font-size="18" fill="#ffffff" text-anchor="start">5 SDIN</text>
<circle cx="440" cy="430" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="430" r="7" fill="#8a8a8a"/>
<text x="440" y="436" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="437" font-size="18" fill="#222" text-anchor="end">6 D2 open</text>
<circle cx="496" cy="374" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="374" r="7" fill="#8a8a8a"/>
<text x="496" y="380" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="381" font-size="18" fill="#ffffff" text-anchor="start">7 D3 GND</text>
<circle cx="440" cy="374" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="374" r="7" fill="#8a8a8a"/>
<text x="440" y="380" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="381" font-size="18" fill="#222" text-anchor="end">8 D4 GND</text>
<circle cx="496" cy="318" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="318" r="7" fill="#8a8a8a"/>
<text x="496" y="324" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="325" font-size="18" fill="#ffffff" text-anchor="start">9 D5 GND</text>
<circle cx="440" cy="318" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="318" r="7" fill="#8a8a8a"/>
<text x="440" y="324" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="325" font-size="18" fill="#222" text-anchor="end">10 D6 GND</text>
<circle cx="496" cy="262" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="262" r="7" fill="#8a8a8a"/>
<text x="496" y="268" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="269" font-size="18" fill="#ffffff" text-anchor="start">11 D7 GND</text>
<circle cx="440" cy="262" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="262" r="7" fill="#8a8a8a"/>
<text x="440" y="268" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="269" font-size="18" fill="#222" text-anchor="end">12 E/RD GND</text>
<circle cx="496" cy="206" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="206" r="7" fill="#8a8a8a"/>
<text x="496" y="212" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="213" font-size="18" fill="#ffffff" text-anchor="start">13 R/W GND</text>
<circle cx="440" cy="206" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="206" r="7" fill="#8a8a8a"/>
<text x="440" y="212" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="213" font-size="18" fill="#222" text-anchor="end">14 DC</text>
<circle cx="496" cy="150" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="496" cy="150" r="7" fill="#8a8a8a"/>
<text x="496" y="156" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="532" y="157" font-size="18" fill="#ffffff" text-anchor="start">15 RES</text>
<circle cx="440" cy="150" r="20" fill="#d9d9d9" stroke="#777" stroke-width="2"/>
<circle cx="440" cy="150" r="7" fill="#8a8a8a"/>
<text x="440" y="156" font-size="15" font-weight="bold" fill="#000" text-anchor="middle" dy="0"></text>
<text x="370" y="157" font-size="18" fill="#222" text-anchor="end">16 CS</text>
<path d="M 440 150 C 402 180, 402 232, 440 262" fill="none" stroke="#2e7d32" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
<path d="M 440 150 C 402 180, 402 232, 440 262" fill="none" stroke="#b0b0b0" stroke-width="3"/>
<circle cx="440" cy="150" r="17" fill="#e8c27a" stroke="#8d6e2f" stroke-width="3"/>
<circle cx="440" cy="150" r="13" fill="none" stroke="#8b4513" stroke-width="3"/>
<circle cx="440" cy="150" r="9" fill="none" stroke="#000000" stroke-width="3"/>
<circle cx="440" cy="150" r="5" fill="none" stroke="#ff8c00" stroke-width="3"/>
<circle cx="440" cy="262" r="10" fill="#c0c0c0" stroke="#555" stroke-width="2"/>
<text x="380" y="116" font-size="17" fill="#2e7d32" text-anchor="end">sleeved lead over pin 14</text>
<line x1="378" y1="120" x2="410" y2="198" stroke="#2e7d32" stroke-width="2"/>
<text x="780" y="140" font-size="18" fill="#111" font-weight="bold">Solder side of the module's header.</text>
<text x="780" y="165" font-size="18" fill="#111" font-weight="normal">Find it by the pins, not left or right:</text>
<text x="780" y="190" font-size="18" fill="#111" font-weight="normal">• pin 1 is the square pad</text>
<text x="780" y="215" font-size="18" fill="#111" font-weight="normal">• the even pins (2 … 16) are the row</text>
<text x="780" y="240" font-size="18" fill="#111" font-weight="normal">  at the board's edge</text>
<text x="780" y="265" font-size="18" fill="#111" font-weight="normal">• pins 16 and 15 are the far end from 1</text>
<text x="780" y="290" font-size="18" fill="#111" font-weight="normal"></text>
<text x="780" y="315" font-size="18" fill="#111" font-weight="bold">Fitting the 10 kΩ (¼ W, brown-black-orange):</text>
<text x="780" y="340" font-size="18" fill="#111" font-weight="normal">1. Stand it upright on pin 16's joint;</text>
<text x="780" y="365" font-size="18" fill="#111" font-weight="normal">   solder its lower lead to the joint.</text>
<text x="780" y="390" font-size="18" fill="#111" font-weight="normal">2. Bend the top lead over and down to</text>
<text x="780" y="415" font-size="18" fill="#111" font-weight="normal">   pin 12; slide heat-shrink or sleeving</text>
<text x="780" y="440" font-size="18" fill="#111" font-weight="normal">   on so it can't touch pin 14 (DC).</text>
<text x="780" y="465" font-size="18" fill="#111" font-weight="normal">3. Solder it to pin 12's joint; trim.</text>
<text x="780" y="490" font-size="18" fill="#111" font-weight="normal">4. Check with a meter: 10 kΩ from 16 to 12,</text>
<text x="780" y="515" font-size="18" fill="#111" font-weight="normal">   and no short from 14 to either.</text>
<text x="780" y="540" font-size="18" fill="#111" font-weight="normal"></text>
<text x="780" y="565" font-size="18" fill="#111" font-weight="normal">Pin 12 is grounded by the cable (it goes</text>
<text x="780" y="590" font-size="18" fill="#111" font-weight="normal">to GND in 4-wire SPI), so CS reads low</text>
<text x="780" y="615" font-size="18" fill="#111" font-weight="normal">through 10 kΩ and the firmware finds the</text>
<text x="780" y="640" font-size="18" fill="#111" font-weight="normal">OLED. Pin 13 (R/W) or pin 1 (GND) also work.</text>
<text x="40" y="710" font-size="18" font-weight="bold" fill="#111">Side view (along the edge row)</text>
<rect x="60" y="850" width="560" height="10" fill="#1f4fa8"/>
<rect x="112" y="836" width="16" height="14" fill="#c0c0c0" stroke="#666"/>
<text x="120" y="884" font-size="16" text-anchor="middle">16</text>
<rect x="222" y="836" width="16" height="14" fill="#c0c0c0" stroke="#666"/>
<text x="230" y="884" font-size="16" text-anchor="middle">14</text>
<rect x="332" y="836" width="16" height="14" fill="#c0c0c0" stroke="#666"/>
<text x="340" y="884" font-size="16" text-anchor="middle">12</text>
<rect x="108" y="770" width="24" height="56" rx="8" fill="#e8c27a" stroke="#8d6e2f" stroke-width="2"/>
<line x1="120" y1="826" x2="120" y2="836" stroke="#777" stroke-width="3"/>
<path d="M 120 770 L 120 755 Q 120 740 140 740 L 320 740 Q 340 740 340 760 L 340 836" fill="none" stroke="#777" stroke-width="3"/>
<path d="M 150 740 L 320 740 Q 340 740 340 760 L 340 810" fill="none" stroke="#2e7d32" stroke-width="10" opacity="0.7"/>
<text x="390" y="790" font-size="16" fill="#2e7d32">sleeve clears pin 14</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" font-family="Helvetica,Arial,sans-serif">
<rect width="1300" height="900" fill="#ffffff"/>
<text x="40" y="50" font-size="30" font-weight="bold" fill="#111">3.12" OLED: 10 kΩ detection resistor on the header's solder side</text>
<text x="40" y="86" font-size="20" fill="#444">Pin 16 (CS) to pin 12 (E/RD, grounded in SPI). Both are in the edge row, with pin 14 (DC) between them.</text>

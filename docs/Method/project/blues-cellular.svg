<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="sans-serif" fill="#222"><rect width="1100" height="560" fill="#fff"/><rect x="30" y="40" width="160" height="300" rx="4" fill="none" stroke="#333"/><text x="110.0" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#222">LilyGO board</text><text x="110.0" y="74" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">T-Display-S3 AMOLED</text><text x="180" y="114" text-anchor="end" font-size="12" font-weight="normal" fill="#222">3V3</text><text x="180" y="154" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GPIO 43 (SDA)</text><text x="180" y="194" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GPIO 44 (SCL)</text><text x="180" y="234" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GND</text><rect x="240" y="40" width="180" height="300" rx="4" fill="none" stroke="#333"/><text x="330.0" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Carrier I2C fan-out</text><text x="330.0" y="74" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">100 kHz, I2C controller 0</text><text x="250" y="114" text-anchor="start" font-size="12" font-weight="normal" fill="#222">3V3</text><polyline points="190,110 240,110" fill="none" stroke="#333"/><text x="250" y="154" text-anchor="start" font-size="12" font-weight="normal" fill="#222">SDA</text><polyline points="190,150 240,150" fill="none" stroke="#333"/><text x="250" y="194" text-anchor="start" font-size="12" font-weight="normal" fill="#222">SCL</text><polyline points="190,190 240,190" fill="none" stroke="#333"/><text x="250" y="234" text-anchor="start" font-size="12" font-weight="normal" fill="#222">GND</text><polyline points="190,230 240,230" fill="none" stroke="#333"/><text x="410" y="274" text-anchor="end" font-size="11" font-weight="normal" fill="#555">Qwiic socket</text><text x="410" y="114" text-anchor="end" font-size="12" font-weight="normal" fill="#222">3V3</text><text x="410" y="154" text-anchor="end" font-size="12" font-weight="normal" fill="#222">SDA</text><text x="410" y="194" text-anchor="end" font-size="12" font-weight="normal" fill="#222">SCL</text><text x="410" y="234" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GND</text><rect x="240" y="380" width="180" height="50" rx="4" fill="none" stroke="#333"/><text x="330.0" y="398" text-anchor="middle" font-size="14" font-weight="600" fill="#222">BME280</text><text x="330.0" y="414" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">0x76, on the carrier</text><rect x="240" y="450" width="180" height="50" rx="4" fill="none" stroke="#333"/><text x="330.0" y="468" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Water probe socket</text><text x="330.0" y="484" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">ADS1115 0x48 (add-on)</text><polyline points="330,340 330,380" fill="none" stroke="#333"/><polyline points="330,360 220,360 220,475 240,475" fill="none" stroke="#333"/><circle cx="330" cy="360" r="3" fill="#333"/><text x="336" y="372" text-anchor="start" font-size="11" font-weight="normal" fill="#555">SDA, SCL, 3V3, GND</text><polyline points="420,150 560,150" fill="none" stroke="#333"/><polyline points="420,190 560,190" fill="none" stroke="#333"/><polyline points="420,230 560,230" fill="none" stroke="#333"/><polyline points="420,110 470,110" fill="none" stroke="#888"/><polyline points="485,105 495,115" fill="none" stroke="#333"/><polyline points="485,115 495,105" fill="none" stroke="#333"/><polyline points="510,110 560,110" fill="none" stroke="#888"/><text x="490" y="130" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">red 3.3 V wire not connected</text><text x="490" y="262" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">Qwiic cable</text><rect x="560" y="40" width="330" height="420" rx="4" fill="none" stroke="#333"/><text x="725.0" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Notecarrier-X v1.3</text><text x="570" y="114" text-anchor="start" font-size="12" font-weight="normal" fill="#888">3V3 (unused)</text><text x="570" y="154" text-anchor="start" font-size="12" font-weight="normal" fill="#222">SDA</text><text x="570" y="194" text-anchor="start" font-size="12" font-weight="normal" fill="#222">SCL</text><text x="570" y="234" text-anchor="start" font-size="12" font-weight="normal" fill="#222">GND</text><text x="570" y="92" text-anchor="start" font-size="11" font-weight="normal" fill="#555">Qwiic</text><rect x="690" y="80" width="180" height="230" rx="4" fill="none" stroke="#333"/><text x="780.0" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Notecard</text><text x="780.0" y="114" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">NOTE-MBGLW v2.5</text><text x="780.0" y="128" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">I2C 0x17, 10 kΩ pull-ups to VIO</text><text x="780.0" y="142" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">VIO 3.3 V from the carrier</text><text x="780.0" y="156" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">VMODEM 2.5 – 5.5 V</text><text x="780.0" y="170" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">LTE Cat-1 bis, cellular only;</text><text x="780.0" y="184" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">GPS only in the setup check</text><polyline points="650,150 690,150" fill="none" stroke="#333"/><polyline points="650,190 690,190" fill="none" stroke="#333"/><text x="860" y="234" text-anchor="end" font-size="12" font-weight="normal" fill="#222">MAIN u.FL</text><text x="860" y="262" text-anchor="end" font-size="12" font-weight="normal" fill="#222">GPS u.FL</text><text x="860" y="290" text-anchor="end" font-size="12" font-weight="normal" fill="#888">WIFI u.FL</text><text x="570" y="344" text-anchor="start" font-size="12" font-weight="normal" fill="#888">ESLOV (ATTN): not used</text><text x="570" y="384" text-anchor="start" font-size="12" font-weight="normal" fill="#222">USB-C: power and charging</text><text x="570" y="424" text-anchor="start" font-size="12" font-weight="normal" fill="#222">JST-PH: LiPo, charger</text><rect x="940" y="200" width="140" height="60" rx="4" fill="none" stroke="#333"/><text x="1010.0" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#222">LTE antenna</text><text x="1010.0" y="234" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">flexible, on MAIN</text><polyline points="870,230 940,230" fill="none" stroke="#333"/><rect x="940" y="285" width="140" height="60" rx="4" fill="none" stroke="#333" stroke-dasharray="6 4"/><text x="1010.0" y="303" text-anchor="middle" font-size="14" font-weight="600" fill="#222">GPS antenna</text><text x="1010.0" y="319" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">optional, gps on</text><polyline points="870,258 910,258 910,315 940,315" fill="none" stroke="#333" stroke-dasharray="6 4"/><text x="940" y="366" text-anchor="start" font-size="11" font-weight="normal" fill="#888">WIFI u.FL: none fitted</text><rect x="940" y="390" width="140" height="60" rx="4" fill="none" stroke="#333"/><text x="1010.0" y="408" text-anchor="middle" font-size="14" font-weight="600" fill="#222">LiPo</text><text x="1010.0" y="424" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">≥ 2000 mAh, 3.7 V</text><polyline points="720,420 940,420" fill="none" stroke="#333"/><text x="30" y="516" text-anchor="start" font-size="12" font-weight="normal" fill="#222">One bus, GPIO 43/44, carries the BME280, the water ADS1115 and the Notecard. Only GND, SDA and SCL cross the Qwiic cable, so the board's 3.3 V</text><text x="30" y="534" text-anchor="start" font-size="12" font-weight="normal" fill="#222">and the Notecarrier's regulator never join. The Notecarrier's LiPo feeds the Notecard and its modem peaks; the board draws nothing for it.</text></svg>

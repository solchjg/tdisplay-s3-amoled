    result: {status: successful, commit: 2b866f5, firmware: 0.0.0-dev (2b866f5, Build Firmware run 40017636168), date: 2026-10-23, evidence: "Build Firmware run 40017636168 inspect step; rerun locally on its artefact: 8 passed"}

  - id: TC-BUILD-06

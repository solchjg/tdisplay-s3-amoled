# Test plan — every test, what it verifies, what it needs, what it last produced.
# Owned by /build. Contract: docs/Functionality/TDisplay-S3-Webserver-FSD.md
#
# Status values: not done | successful | failed — written by whatever ran the
# test, never by hand, always with the commit. Blocked is computed from
# `needs` against `capabilities`; never typed.

project: tdisplay-s3-webserver
fsd: docs/Functionality/TDisplay-S3-Webserver-FSD.md
dut:
  board: LilyGO T-Display-S3 (non-touch, 16 MB flash, 8 MB PSRAM)
  chip: esp32s3
  slot: SLOT4
  serial: rfc2217://192.168.2.230:4004
testbench:
  url: http://192.168.2.230:8080
  record:   # dated observation (memory); tests select the bench by identity
    observed: 2026-10-23
    hostname: testbench-0441
    last_seen_ip: 192.168.2.230
    portal_version: not reported (/api/info carries none)
dut_record:   # the unit this project is verified against (observed 2026-10-23, /api/chip/info SLOT4)
  chip: ESP32-S3 (QFN56)
  revision: v0.1
  psram: embedded 8MB (AP_3v3)
  flash: 16MB (manufacturer 0xef, device 0x4018), quad
  mac: 34:85:18:71:c7:34
  usb: USB-Serial/JTAG 303a:1001, /dev/ttyACM0

# ── Capabilities ─────────────────────────────────────────────────────────
# Bench capabilities: `yes` as the bench declares them (Harness FSD); a
# project never proves the bench. Project-side equipment: `unproven` until
# /commission observes it working here — each one is a debugging-agenda item.
capabilities:
  bench-flash:
    what: Flash an image set to SLOT4 over USB (Harness /api/flash)
    available: yes
    # Usage notes (2026-10-23): upload the artefact's flash_args file with the
    # parts (tests/bench/conftest.py does). Even then the bench flashes 40 MHz
    # and keeps the flash size: pi/portal.py's flash_args parser reads only
    # the first option of a line, and ESP-IDF writes all three on one line
    # (DUT boot: "Boot SPI Speed : 40MHz" for an 80m build, fw 0.0.0-41110fb).
    # Bench fault filed: SensorsIot/Embedded-AI-Harness#52. No FSD clause states
    # a flash clock, so nothing here is blocked.
    # /api/chip/info is logged as "flash(SLOT4)": filed as #53.
    # /api/chip/info runs esptool and appears in the activity log as
    # "flash(SLOT4)" with about 665 bytes of output (02:47:11Z, 03:04:14Z); it
    # reads identity and does not write an image.
  bench-serial-monitor:
    what: Read SLOT4 serial with pattern wait, DTR/RTS held low (Harness serial monitor)
    available: yes
    # Usage note carried from esp32-oled-hello: a `^`-anchored pattern did not
    # match lines the monitor itself returned; use unanchored patterns.
    # Usage note (2026-10-23): a monitor running when the bench serial reset
    # is issued ends at once with "timeout, no match" (log 03:02:53Z), so it
    # cannot catch a one-shot boot line across a reset. Read the boot capture
    # that the serial reset returns, or match a periodic line.
  bench-usb-reset:
    what: Reset the DUT in SLOT4 over USB-Serial/JTAG (Harness serial reset)
    available: yes
    # Usage note (2026-10-23): on this native-USB S3 the DTR/RTS reset resets the
    # chip a second time ~3.4 s after its 5 s capture, when the bench reopens
    # the port (pi/portal.py serial_reset -> start_proxy). The capture shows
    # boot B; the board then runs boot C, whose first ~1 s nobody reads
    # (raw dump: tdisplay-s3-hello testing/evidence/runs/slot4-double-reset-ring.json). Fine for
    # "what does a boot print"; wrong for any no-reset window. Bench fault:
    # SensorsIot/Embedded-AI-Harness#47 (reproduction and code path commented).
  bench-jtag-reset:
    what: Reset SLOT4 through its built-in USB-JTAG in a debug session, keeping the serial proxy up (Harness debug + serial reset)
    available: yes
    # One boot, lines live in the ring with bench timestamps; the 5 s capture
    # is re-pushed as a block sharing one timestamp (conftest.reset_and_follow).
  bench-operator-prompt:
    what: Blocking operator prompt with yes/no answer and timestamp (Harness human interaction)
    available: yes
  bench-test-progress:
    what: Live test-session progress on the bench web UI
    available: yes
  bench-wifi-scan:
    what: WiFi scan from the bench radio
    available: yes
  bench-ble-scan:
    what: BLE scan from the bench
    available: yes
  bench-flash-erase:
    what: Erase the whole flash of SLOT4 before writing (Harness /api/flash, field erase)
    available: yes
  bench-wifi-ap:
    what: Start and stop a WPA2 access point on the bench radio, with DHCP and a station list (Harness /api/wifi/ap_start, ap_stop, ap_status)
    available: yes
  bench-wifi-sta:
    what: Join and leave a DUT's SoftAP as a station (Harness /api/wifi/sta_join, sta_leave)
    available: yes
  bench-enter-portal:
    what: "Join a DUT's open SoftAP, POST credentials to http://192.168.4.1/connect (fields ssid, password), leave, start the bench AP with those credentials (Harness /api/enter-portal)"
    available: yes
  bench-http-relay:
    what: HTTP request from the bench radio to a device on the bench Wi-Fi network (Harness /api/wifi/http)
    available: yes
  bench-udp-log:
    what: Receive and list UDP log lines on port 5555, with source address (Harness /api/udplog)
    available: yes
  bench-portscan:
    what: TCP port scan of a device on the bench Wi-Fi network (Harness /api/net/portscan)
    available: yes
  bench-firmware-hosting:
    what: Host an image (/api/firmware/upload) and serve it at http://<bench>:8080/firmware/<project>/<file>
    available: yes
    # Whether a client on the bench AP network reaches port 8080 is FSD R-6.
    # It is the bench's declaration, not this project's to prove; a
    # disproof by DUT evidence is filed against the bench.
  bench-mdns-resolve:
    what: Bench resolves <name>.local on its AP network (needed by FR-17.1)
    available: no
    # Not among the bench's declared capabilities (FSD R-8).
    # Consequence: FR-17.1's bench test (mDNS name resolution) is blocked until
    # the bench declares it; FR-17.1 is a Should, so shipment needs a decision.
  bench-relay-dns-via-dut:
    what: The HTTP relay resolves names through the DNS of the SoftAP it has joined (needed by FR-13.5)
    available: no
    # Not among the bench's declared capabilities (FSD R-7).
    # Consequence: FR-13.5's bench test (captive DNS) is blocked until the
    # bench declares it; FR-13.5 is a Should, so shipment needs a decision.
  slot4-gpio-reset:
    what: EN/BOOT reset and download mode via bench GPIO on SLOT4
    available: no
    # Bench reports gpio_wired=false for SLOT4 (EN pulse produced no reset).
    # Consequence: no GPIO recovery of a crash-looping or wedged DUT; recovery
    # is USB reset, or an operator holding BOOT (GPIO 0) while replugging USB-C.
  bench-wifi-scan-bssid:
    what: WiFi scan that reports each network's BSSID, so the DUT's MAC can be recognised
    available: no
    # /api/wifi/scan returns ssid, rssi, auth, channel only (2026-10-23).
    # Bench gap: SensorsIot/Embedded-AI-Harness#50.
    # Consequence: nothing is blocked. SoftAP presence (FR-5.11, FR-9.4,
    # FR-13.1) is matched by the DUT's own SSID TDS3-<MAC suffix>, which it
    # also logs (FR-7.9, K2); FSD R-12.
  seam-no-confirm-build:
    what: "Test build identical to the shipped one except that it never marks itself valid (FSD FR-5.24, §5.6)"
    available: unproven
    # Does not exist yet; proven by its CI job going green.
  seam-hang-build:
    what: "Test build that blocks the application task 20 s after startup (variant app) or an HTTP handler on GET /hang (variant http) (FSD §19.3)"
    available: unproven
    # Does not exist yet; proven by its CI job going green for both variants.
  stall-http-peer:
    what: "HTTP server reachable from the bench AP network that sends headers and 100 kB of an image, then holds the connection silent (FSD FR-15.11 stall contract)"
    available: unproven
    # No such peer exists. Owner: this project (a peer it brings), proven in /commission.
  seam-lcd-fault-injection:
    what: "Test build whose LCD interface returns a chosen esp_err_t at init or the k-th draw, logging `lcdfi: call`"
    available: unproven
    # Carried from tdisplay-s3-hello (tests/target/lcd_fault/, CI job lcd-fault);
    # not yet built by this repo's CI.
  release-verification:
    what: Tag-triggered journey run against the released artifact
    available: unproven
    # Needs a registered `testbench` runner for this repo (.devcontainer/register-runner.sh).
    # An absent bench at verify time is an unmet precondition (not done), never a failure.
  dut-tdisplay-s3-slot4:
    what: The board in SLOT4 is a T-Display-S3 with 16 MB flash; a CI-built image flashes over USB and its log reaches SLOT4's monitor
    available: unproven
    # Proven for tdisplay-s3-hello on 2026-10-23 (its test-plan.yaml); this
    # repo's evidence must come from this repo's CI artefacts.
  lcd-st7789:
    what: The built-in ST7789 lights correctly with the T-Display-S3 pin map, GPIO 15 power, GPIO 38 backlight, 10 MHz i80 clock and offset 35
    available: unproven
    # Proven for tdisplay-s3-hello on 2026-10-23: invert_color(true),
    # swap_xy(true), mirror(false, true), set_gap(0, 35), RGB order, RGB565
    # bytes swapped. Re-observe here with this repo's commissioning/lcd-probe.
  dut-wifi-slot4:
    what: The T-Display-S3 in SLOT4 associates with the bench AP and obtains a DHCP lease
    available: unproven
    # This board's radio and antenna have never been seen working here.
  dut-boot-button:
    what: Firmware on the T-Display-S3 in SLOT4 reads GPIO 0 low while an operator holds BOOT, high on release
    available: unproven
  operator-at-bench:
    what: A person at the bench answers operator prompts and can see the T-Display-S3 panel, held USB-C to the right
    available: unproven
    # An answer counts only when given on the Pi display and the bench logs
    # "Human confirmed".

# ── Gate verdicts ────────────────────────────────────────────────────────
gates:
  - gate: AI harnessed
    verdict: OPEN
    date: 2026-10-23
    commit: 08fa152
    checker: fresh subagent, gate file + repo only (third round; rounds 1-2 SHUT, findings fixed)
    ci: [Build Firmware 40003952313 success, host tests + lint 40003948865 success]

# ── Tests ────────────────────────────────────────────────────────────────
# JRN-01 is the standard run (one ordinary successful use, end to end), one
# test per step. It gates every hardware session and runs on every release
# tag. Atomic tests (TC-<area>-<nn>) are declared by /build per wave.
tests:
  - id: JRN-01.1
    title: Erase SLOT4 and flash the firmware over USB
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 1
    tier: bench
    verifies: [C-10.5]
    needs: [bench-flash, bench-flash-erase, dut-tdisplay-s3-slot4]
    observable: flash with erase reports success for every image in flash_args
    impl: tests/bench/test_journey.py::test_jrn_01_1_erase_and_flash
    result: {status: not done, reason: not yet implemented}

  - id: JRN-01.2
    title: First boot opens the provisioning portal
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 2
    tier: bench
    verifies: [FR-5.11, FR-13.1, FR-7.18, FR-7.19]
    needs: [bench-usb-reset, bench-serial-monitor, bench-wifi-scan, dut-tdisplay-s3-slot4, dut-wifi-slot4]
    observable: "`web: state=PROVISIONING` and `AP mode: SSID='TDS3-71C734'` on serial; the bench scan sees open SSID TDS3-71C734"
    impl: tests/bench/test_journey.py::test_jrn_01_2_portal_open
    result: {status: not done, reason: not yet implemented}

  - id: JRN-01.3
    title: The bench provisions credentials through the portal
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 2
    tier: bench
    verifies: [FR-5.13, FR-13.3, FR-7.21]
    needs: [bench-enter-portal, bench-serial-monitor, dut-wifi-slot4]
    observable: "`Credentials saved` and `web: provisioned ssid=<bench SSID>` on serial, with no boot line after them"
    impl: tests/bench/test_journey.py::test_jrn_01_3_provisioned
    result: {status: not done, reason: not yet implemented}

  - id: JRN-01.4
    title: The device joins the bench AP
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 2
    tier: bench
    verifies: [FR-5.15, FR-7.10, FR-7.23]
    needs: [bench-wifi-ap, bench-serial-monitor, dut-wifi-slot4]
    observable: "`STA got IP` and `web: online ip=<a.b.c.d>`; the bench AP station list holds the DUT's MAC with that IP"
    impl: tests/bench/test_journey.py::test_jrn_01_4_online
    result: {status: not done, reason: not yet implemented}

  - id: JRN-01.5
    title: The status API answers with the flashed version
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 3
    tier: bench
    verifies: [FR-14.2, FR-20.3]
    needs: [bench-http-relay, dut-wifi-slot4]
    observable: "relay GET http://<ip>/api/status → 200, JSON with the 7 keys, fw_version equal to the artefact's version, ip equal to step 4's"
    impl: tests/bench/test_journey.py::test_jrn_01_5_status
    result: {status: not done, reason: not yet implemented}

  - id: JRN-01.6
    title: The display mirrors IP and request count
    shape: workflow
    kind: standard
    wave: 1
    fsd_phase: 3
    tier: bench
    verifies: [FR-5.25, FR-5.26, FR-7.11]
    needs: [bench-serial-monitor, bench-http-relay, lcd-st7789, dut-wifi-slot4]
    observable: "`web: lcd line1=\"IP <step 4's ip>\"` and, within 2 s of step 5's answer, `web: lcd line2=\"Req: <its requests value>\"`"
    impl: tests/bench/test_journey.py::test_jrn_01_6_display_mirror
    result: {status: not done, reason: not yet implemented}

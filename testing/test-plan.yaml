# Test plan — every test, what it verifies, what it needs, what it last produced.
# Owned by /build. Contract: docs/Functionality/TDisplay-S3-Webserver-FSD.md
#
# Status values: not done | successful | failed — written by whatever ran the
# test, never by hand, always with the commit. Blocked is computed from
# `needs` against `capabilities`; never typed.

project: tdisplay-s3-amoled
fsd: docs/Functionality/TDisplay-S3-Webserver-FSD.md
dut:
  board: LilyGO T-Display-S3 AMOLED 1.91" (16 MB flash, 8 MB PSRAM)
  chip: esp32s3
  slot: SLOT1
  serial: rfc2217://192.168.2.230:4001
testbench:
  url: http://192.168.2.230:8080
  record:   # dated observation (memory); tests select the bench by identity
    observed: 2026-10-23
    hostname: testbench-0441
    last_seen_ip: 192.168.2.230
    portal_version: not reported (/api/info carries none)
dut_record:   # the unit this project is verified against (observed 2026-10-29, esptool via /api/flash SLOT1)
  chip: ESP32-S3 (QFN56)
  revision: v0.2
  psram: embedded 8MB (AP_3v3)
  flash: 16MB
  mac: 48:27:e2:ea:48:3c
  reserved_ip: 192.168.40.150   # router DHCP reservation on IOTID, set 2026-10-31
  usb: USB-Serial/JTAG 303a:1001, /dev/ttyACM0

# ── Capabilities ─────────────────────────────────────────────────────────
# Bench capabilities: `yes` as the bench declares them (Harness FSD); a
# project never proves the bench. Project-side equipment: `unproven` until
# /commission observes it working here — each one is a debugging-agenda item.
capabilities:
  bench-flash:
    what: Flash an image set to SLOT1 over USB (Harness /api/flash)
    available: yes
    # Usage notes (2026-10-23): upload the artefact's flash_args file with the
    # parts (tests/bench/conftest.py does). Even then the bench flashes 40 MHz
    # and keeps the flash size: pi/portal.py's flash_args parser reads only
    # the first option of a line, and ESP-IDF writes all three on one line
    # (DUT boot: "Boot SPI Speed : 40MHz" for an 80m build, fw 0.0.0-41110fb).
    # Bench fault filed: SensorsIot/Embedded-AI-Harness#52. No FSD clause states
    # a flash clock, so nothing here is blocked.
    # /api/chip/info is logged as "flash(SLOT4)": filed as #53.
    # /api/chip/info runs esptool and appears in the activity log as
    # "flash(SLOT4)" with about 665 bytes of output (02:47:11Z, 03:04:14Z); it
    # reads identity and does not write an image.
  bench-serial-monitor:
    what: Read SLOT1 serial with pattern wait, DTR/RTS held low (Harness serial monitor)
    available: yes
    # Usage note (2026-10-23): /api/serial/output can hold the same device line
    # twice in a row (seen around flashes and debug sessions). Tests counting
    # lines collapse adjacent duplicates (tests/bench/test_rollback.py).
    # Usage note carried from esp32-oled-hello: a `^`-anchored pattern did not
    # match lines the monitor itself returned; use unanchored patterns.
    # Usage note (2026-10-23): a monitor running when the bench serial reset
    # is issued ends at once with "timeout, no match" (log 03:02:53Z), so it
    # cannot catch a one-shot boot line across a reset. Read the boot capture
    # that the serial reset returns, or match a periodic line.
  bench-usb-reset:
    what: Reset the DUT in SLOT1 over USB-Serial/JTAG (Harness serial reset)
    available: yes
    # Usage note (2026-10-23): on this native-USB S3 the DTR/RTS reset resets the
    # chip a second time ~3.4 s after its 5 s capture, when the bench reopens
    # the port (pi/portal.py serial_reset -> start_proxy). The capture shows
    # boot B; the board then runs boot C, whose first ~1 s nobody reads
    # (raw dump: tdisplay-s3-hello testing/evidence/runs/slot4-double-reset-ring.json). Fine for
    # "what does a boot print"; wrong for any no-reset window. Bench fault:
    # SensorsIot/Embedded-AI-Harness#47 (reproduction and code path commented).
  bench-jtag-reset:
    what: Reset SLOT1 through its built-in USB-JTAG in a debug session, keeping the serial proxy up (Harness debug + serial reset)
    available: yes
    # Usage note: now and then a capture holds no `rst:` line (seen 2026-10-23
    # right after a flash, and twice on 2026-11-05); an immediate re-run is
    # clean. conftest.reset_and_follow resets once more when that happens.
    # One boot, lines live in the ring with bench timestamps; the 5 s capture
    # is re-pushed as a block sharing one timestamp (conftest.reset_and_follow).
  bench-operator-prompt:
    what: Blocking operator prompt with yes/no answer and timestamp (Harness human interaction)
    available: yes
  bench-test-progress:
    what: Live test-session progress on the bench web UI
    available: yes
  bench-wifi-scan:
    what: WiFi scan from the bench radio
    available: yes
  bench-wifi-events:
    what: Station connect/disconnect events on the bench AP with MAC, IP and DHCP hostname (Harness /api/wifi/events)
    available: yes
  bench-ble-scan:
    what: BLE scan from the bench
    available: yes
  bench-ble-pair-passkey:
    what: The bench BLE central completes LE Secure Connections passkey pairing (passkey typed from the operator) and then reads/writes protected characteristics
    available: unproven
    # R-24: ble_connect / ble_write exist; passkey pairing is not declared.
  bench-flash-erase:
    what: Erase the whole flash of SLOT1 before writing (Harness /api/flash, field erase)
    available: yes
  bench-wifi-ap:
    what: Start and stop a WPA2 access point on the bench radio, with DHCP and a station list (Harness /api/wifi/ap_start, ap_stop, ap_status)
    available: yes
    # Usage note (2026-10-23): the first ap_start of the session (18:42Z,
    # tds3-commission) left the DUT associating and being dropped with reason 2
    # (AUTH_EXPIRE), no station listed, no wifi event; ap_stop + ap_start fixed
    # it at once. The body field for the passphrase is `pass`. Candidate bench
    # fault: file it with the bench owner if a test sees it again (never
    # worked around in this project's tests).
  bench-ap-rejoin-after-reset:
    what: The bench AP lets a station that reset without a deauth (JTAG/USB reset, power cycle) authenticate again
    available: no
    observed: 2026-10-23
    evidence: >
      Product firmware fd7b45c: after a JTAG reset of a joined DUT, every
      auth attempt ends `wifi:state: auth -> init (0x200)` for > 100 s while
      ap_status keeps listing the old station (ap_max_inactivity 20 s not
      applied). Positive control, commissioning wifi-probe (run 40004940061):
      first join to a fresh AP got 192.168.4.6, then after each of two JTAG
      resets 8 x `disconnected reason=2` (AUTH_EXPIRE) in 20 s, no IP. A
      fresh ap_start always admits the station. Same family as the
      bench-wifi-ap note of 18:42Z.
    consequence: >
      Bench fault: SensorsIot/Embedded-AI-Harness#54. Tests that reset a provisioned DUT and expect it back on the
      same AP are blocked: TC-NET-10 (NFR-5.1, FR-5.20 reset), TC-NET-12
      (FR-5.20 power cycle), and later NFR-5.2/FR-5.19 style recoveries that
      keep the AP up across a DUT reset. Never worked around in this project.
  bench-wifi-sta:
    what: Join and leave a DUT's SoftAP as a station (Harness /api/wifi/sta_join, sta_leave)
    available: yes
  bench-enter-portal:
    what: "Join a DUT's open SoftAP, POST credentials to http://192.168.4.1/connect (fields ssid, password), leave, start the bench AP with those credentials (Harness /api/enter-portal)"
    available: yes
    # Usage note (2026-10-23): TestbenchDriver.enter_portal() sends {slot, resets},
    # not the REST fields; tests post {portal_ssid, ssid, password} directly
    # (tests/bench/conftest.py enter_portal). Driver fault:
    # SensorsIot/Embedded-AI-Harness#56.
  bench-http-relay:
    what: HTTP request from the bench radio to a device on the bench Wi-Fi network (Harness /api/wifi/http)
    available: yes
  bench-udp-log:
    what: Receive and list UDP log lines on port 5555, with source address (Harness /api/udplog)
    available: yes
  bench-portscan:
    what: TCP port scan of a device on the bench Wi-Fi network (Harness /api/net/portscan)
    available: yes
  bench-firmware-hosting:
    what: Host an image (/api/firmware/upload) and serve it at http://<bench>:8080/firmware/<project>/<file>
    available: yes
    # Whether a client on the bench AP network reaches port 8080 is FSD R-6.
    # It is the bench's declaration, not this project's to prove; a
    # disproof by DUT evidence is filed against the bench.
  bench-mdns-resolve:
    what: Bench resolves <name>.local on its AP network (needed by FR-17.1)
    available: no
    # Not among the bench's declared capabilities (FSD R-8).
    # Consequence: FR-17.1's bench test (mDNS name resolution) is blocked until
    # the bench declares it; FR-17.1 is a Should, so shipment needs a decision.
  bench-relay-dns-via-dut:
    what: The HTTP relay resolves names through the DNS of the SoftAP it has joined (needed by FR-13.5)
    available: no
    # Not among the bench's declared capabilities (FSD R-7).
    # Consequence: FR-13.5's bench test (captive DNS) is blocked until the
    # bench declares it; FR-13.5 is a Should, so shipment needs a decision.
  slot1-gpio-reset:
    what: EN/BOOT reset and download mode via bench GPIO on SLOT1
    available: unproven
    # The bench configures EN/BOOT GPIOs for SLOT1 (gpio_wired not yet measured).
    # Until proven, recovery is USB reset, or an operator holding BOOT (GPIO 0)
    # while replugging USB-C.
  bench-udp-listener-off:
    what: Stop the bench's UDP log listener on port 5555 (needed by FR-16.3)
    available: no
    observed: 2026-10-23
    # The listener is part of the portal and always runs; no API stops it.
    # Consequence: FR-16.3 (no receiver leaves logging and HTTP unaffected) has
    # no bench run. MSG_DONTWAIT sends make it hold by construction (udp_log.c).
  bench-scan-while-ap:
    what: Scan WiFi while the bench AP is running (needed by the ONLINE part of FR-9.4)
    available: no
    observed: 2026-10-23
    # /api/wifi/scan answers 503 "cannot scan while the AP is running: this
    # radio cannot beacon and survey at once".
    # Consequence: FR-9.4's ONLINE part is blocked; CONNECTING/WIFI_LOST parts
    # are verified (TC-SEC-12, TC-NET-11, TC-REC-13).
  bench-wifi-scan-bssid:
    what: WiFi scan that reports each network's BSSID, so the DUT's MAC can be recognised
    available: no
    # /api/wifi/scan returns ssid, rssi, auth, channel only (2026-10-23).
    # Bench gap: SensorsIot/Embedded-AI-Harness#50.
    # Consequence: nothing is blocked. SoftAP presence (FR-5.11, FR-9.4,
    # FR-13.1) is matched by the DUT's own SSID TDS3-<MAC suffix>, which it
    # also logs (FR-7.9, K2); FSD R-12.
  seam-no-network-build:
    what: "Test build identical to the shipped one except that it never starts a station attempt, so it never reaches ONLINE (FSD FR-5.24, §5.6)"
    available: yes
    observed: 2026-10-23
    evidence: >
      tests/target/no_network, Build Firmware run 40033728057 job no-network
      success, artefact nonetwork (tdisplay_webserver_nonetwork.bin, version
      0.0.0-no-network). On SLOT4 it stayed CONNECTING/WIFI_LOST, never
      ONLINE, and was rolled back by T13 (TC-OTA-20).
  seam-hang-build:
    what: "Test build that blocks the application task 20 s after startup (variant app) or an HTTP handler on GET /hang (variant http) (FSD §19.3)"
    available: yes
    observed: 2026-10-23
    evidence: >
      tests/target/hang, Build Firmware run 40035493595 jobs hang (app) and
      hang (http) success. On SLOT4 both hung as designed and were restarted
      by the task watchdog with reason TASK_WDT (TC-WDT-10, TC-WDT-11).
  stall-http-peer:
    what: "HTTP server reachable from the bench AP network that sends headers and 100 kB of an image, then holds the connection silent (FSD FR-15.11 stall contract)"
    available: no
    observed: 2026-10-23
    consequence: >
      Only the bench Pi is on the bench AP network, so a project peer cannot
      reach the DUT. A testbench change request (a stall mode on the
      /firmware/ route) is filed as SensorsIot/Embedded-AI-Harness#55; until the bench
      declares it, the FR-15.11 (stall) contract is blocked. The other
      FR-15.11 failure modes (bad image, oversize, 404) need only
      bench-firmware-hosting.
  seam-lcd-fault-injection:
    what: "Test build whose LCD interface returns a chosen esp_err_t at init or the k-th draw, logging `lcdfi: call`"
    available: yes
    observed: 2026-10-23
    evidence: >
      Build Firmware runs 40002443185 and 40003952313: jobs `lcd-fault (init)`
      and `lcd-fault (write5)` success, artefacts lcdfault-init / lcdfault-write5.
    consequence: >
      It stubs the base project's `lcd` under hello_* logic; when /build
      replaces hello_logic with device_logic it must keep this build compiling
      against the new composition root.
  release-verification:
    what: Tag-triggered journey run against the released artifact
    available: no
    observed: 2026-10-23
    evidence: >
      The owner started .devcontainer/register-runner.sh and it reported
      "Listening for Jobs", but at 18:59:51Z, 19:00:33Z and 19:05:21Z GitHub
      listed no runner on this repo (total_count 0), none on any other
      solchjg repo, and the account has no organisations. The listening
      runner is registered somewhere other than this repo.
    consequence: >
      No v*.*.* tag can be released: the verify job would wait for a
      `testbench` runner that never picks it up. Development and every
      non-release test are unaffected. Before the first tag, re-register the
      runner for this repo (fresh registration token, then
      `gh api repos/solchjg/tdisplay-s3-amoled/actions/runners` lists it)
      and flip this to yes. The Shipped gate cannot open until then.
  dut-amoled-slot1:
    what: The board in SLOT1 is a T-Display-S3 AMOLED with 16 MB flash; a locally built image flashes over USB and its log reaches SLOT1's monitor
    available: yes
    observed: 2026-10-29
    evidence: >
      /api/flash SLOT1 22:30:18Z: esptool reports ESP32-S3 (QFN56) v0.2,
      embedded PSRAM 8MB, MAC 48:27:e2:ea:48:3c; lcd-probe (0x0 bootloader,
      0x8000 partition table, 0x10000 lcd_probe.bin) written and hash-verified.
      Serial monitor matched `lcdprobe: alive 2 drawn` (22:30:29Z).
    consequence: >
      Flash over USB and the serial monitor work on SLOT1 with this board. The
      product image's own partition layout is proven by JRN-01.1.
  lcd-rm67162:
    what: The built-in RM67162 lights correctly with the T-Display-S3 AMOLED QSPI pin map, GPIO 38 power, 75 MHz and MADCTL 0x60
    available: yes
    observed: 2026-10-29
    evidence: >
      lcd-probe (commissioning/lcd-probe, built on shared/components/rm67162
      at a5221a9) flashed 22:30:18Z: start, every draw and brightness returned
      ESP_OK, `pattern drawn`. Operator prompt 22:30:38Z, "Human confirmed"
      22:31:40Z: USB-C on the right, black background, white frame on all four
      edges with nothing cut off, RED top-left, GREEN top-right, BLUE
      bottom-left. At 75 MHz (shared 234631b, shipped build
      0.0.0-234631b-75m): provisioned and ONLINE at 192.168.4.8, GET / and
      /api/status 200, operator confirmed the ONLINE screen clean (2026-10-29
      ~23:00Z).
    consequence: >
      Confirmed settings: 75 MHz requested (80 MHz on the bus), MADCTL 0x60, no RAM offset, 536 x 240 landscape,
      RGB565 bytes swapped, LilyGO's 1.91" init sequence. Orientation prompts
      state "USB-C cable leaving the board on your right".
  dut-wifi-slot1:
    what: The T-Display-S3 AMOLED in SLOT1 associates with the bench AP and obtains a DHCP lease
    available: yes
    observed: 2026-10-29
    evidence: >
      Shipped build 0.0.0-929e84a (local build, flashed with whole-flash erase
      22:37:43Z): PROVISIONING with SoftAP TDS3-EA483C (open, seen by a bench
      scan); enter-portal with tds3-bench 22:39:24Z, portal answered 200;
      `web: online ip=192.168.4.8 rssi=-58` 22:39:44Z; GET /api/status and
      GET / through the HTTP relay both 200 (fw_version 0.0.0-929e84a,
      hostname tds3-ea483c); mirror lines `IP 192.168.4.8` / `Req: 2` /
      `tds3-ea483c.local`, operator confirmed with USB-C on the right ("Human
      confirmed" 22:41:17Z).
    consequence: >
      The board's radio is good at the bench distance (RSSI around -58 dBm).
  dut-boot-button:
    what: Firmware on the T-Display-S3 AMOLED in SLOT1 reads GPIO 0 low while an operator holds BOOT, high on release
    available: yes
    observed: 2026-10-29
    evidence: >
      Bench run from 340fe60 (shared 234631b), shipped build 0.1.0 (local
      build): test_button.py short press (nothing changes) and long press
      (reset on release, credentials erased, back to PROVISIONING) both
      passed with the operator holding BOOT; evidence button-long-press.
    consequence: >
      GPIO 0 reads active low on this board; FR-18.x tests can rely on an
      operator press.
  seam-sleep-build:
    what: "Test build whose stand-in task asks for SLEEP_S s of deep sleep twice per power-on, then stays awake (FSD §21.3); SLEEP_S 10 and 300"
    available: yes
    observed: 2026-10-30
    evidence: >
      TC-SLP-10 run 3 (c55b4c9, CI run 40997968059): NVS history window
      sleep at 60.6 s, timer wakes after 10.8 s (re-slept at 107 ms) and
      10.4 s, then a bench USB reset.
    consequence: >
      Built by the CI job sleep; its boot history lives in NVS because the
      bench's USB reset clears RTC memory.
  seam-mail-fast-build:
    what: "Test build with one mail_every unit worth 5 minutes instead of an hour (FSD §25)"
    available: yes
    observed: 2026-10-31
    evidence: >
      CI run 41251914176, off the bench USB: summaries on 5-minute slots with 4 or
      5 readings each; table rows 20:05 to 20:25 listed once each with no gap across
      four emails. The 20:20 slot sent nothing; the next email covered its readings.
    consequence: >
      Built by the CI job mail-fast; it keeps the stored mail settings when
      flashed without an erase. On the bench USB each summary covers only its boot.
  dut-user-key:
    what: Firmware on the T-Display-S3 AMOLED in SLOT1 wakes from deep sleep when an operator presses the user key (GPIO 21)
    available: yes
    observed: 2026-10-30
    evidence: >
      TC-SLP-11 (59c7722): NVS history boot seq 8 reset=deepsleep
      wake=button after 28.0 s of a 300 s sleep; operator confirmed the
      panel dark while asleep.
    consequence: >
      GPIO 21 is the user key per LilyGO's factory pins_config.h, not yet
      observed on this unit; TC-SLP-11 is its first run.
  bench-current-meter:
    what: Measure the DUT's supply current in deep sleep to the microampere
    available: no
    consequence: >
      The bench declares no current meter (R-17), so NFR-21.1 has no bench run.
  bench-internet:
    what: The bench AP gives the DUT a route to the internet (pool.ntp.org, UDP 123)
    available: unproven
    consequence: >
      R-19; TC-TIME-10 is its first run. If the bench AP has no route, the
      test is blocked by a testbench change request, never worked around.
  oled-ssd1322:
    what: The cellular build's 3.12" SSD1322 OLED shows the six lines the right way round with the init sequence and nibble order of shared/components/ssd1322 (FSD FR-35.16)
    available: unproven
    consequence: >
      Never seen on a panel (testing/debugging-agenda.md); the FR-35.16 bench
      row in Phase 17 step 8 is its first run.
  oled-standin:
    what: The 1.3" 128 x 64 OLED on the Waveshare board's sensor bus (GPIO 15/16) answers at 0x3C or 0x3D beside the BME280 and the MAX17048 and shows the six lines the right way round as an SH1106 (or an SSD1306 with CONFIG_APP_OLED_STANDIN_SH1106=n) (FSD FR-35.22)
    available: unproven
    consequence: >
      Seen on the T-SIM7080G modem probe through the I2C controller, never on
      the Waveshare board's sensor bus (testing/debugging-agenda.md); the
      FR-35.22 bench row is its first run.
  sd-card-ws:
    what: The Waveshare board's microSD slot, always powered, mounts a FAT32 card over SDMMC 1-bit (CMD 4, CLK 5, D0 6, the ESP32-S3's pull-ups) and reads and writes it; an empty slot fails the mount with a timeout (FSD FR-35.4, FR-35.20)
    available: unproven
    consequence: >
      commissioning/ws-probe mounted a card and timed out on an empty slot,
      but has not written one; the empty slot's error code is what L49 `none`
      rests on (testing/debugging-agenda.md). The FR-35.4 bench row is its
      first full run.
  modem-sim7670:
    what: The Waveshare ESP32-S3-SIM7670G-4G in SLOT2 with its 4G switch off with a cell fitted answers AT on UART 1 (RX GPIO 17, TX GPIO 18) once GPIO 21 is high, registers, falls silent after AT+CPOF, and stays unpowered with GPIO 21 held low in deep sleep; its MAX17048 answers at 0x36 on GPIO 15/16 (FSD §35.2, FR-35.23)
    available: unproven
    consequence: >
      Taken from Waveshare's examples and FAQ (testing/debugging-agenda.md);
      commissioning/ws-probe is its first run.
  dut-bme280:
    what: A BME280 (chip ID 0x60) at 0x76 (or 0x77, FR-23.1) on SDA GPIO 43 / SCL GPIO 44 of the board in SLOT1
    available: unproven
    consequence: >
      Wired by the user (2026-10-30); not yet observed answering. TC-WX-10
      is its first run.
  dut-notecard:
    what: A Blues NOTE-NBGLWX (Notecard for Skylo, Quectel BG95-S5) on a Notecarrier-X at 0x17 on SDA GPIO 43 / SCL GPIO 44 (100 kHz) of the board in SLOT1, beside the BME280 and the RV-8803, the Notecarrier on its own supply, taking note.add batches and joining LTE-M; the NOTE-MBGLW the evidence below starts with is the earlier bench card
    available: yes
    observed: 2026-11-10
    evidence: >
      NOTE-NBGLWX, 2026-11-10 ~01:06Z: notecard-probe (commissioning workflow
      run 42721957464, main fc66f31, PROBE_PRODUCT field_data_monitor, PROBE_SYNC)
      on the board with MAC 48:27:e2:ea:48:3c. On a USB hub port the Notecard
      did not start (no 0x17; every request "i2c: transmit failed {io}"); on
      its own supply: scan 0x17 0x32 0x6a 0x76; the first card.version after
      boot answered "cannot interpret JSON: ':' expected near 'req' {io}",
      every later request clean; modem BG95S5LAR08A03; Notehub shows firmware
      11.4.1.17828 for dev:862063070140210; hub.get product as set, periodic,
      60/1440; card.transport cell; note.add of 100 readings (9207-byte body)
      6770 ms, of 50 (4607 bytes) 3385 ms, both accepted; forced sync complete
      in about 117 s (about 70 s to register) on LTE-M (eMTC) band 12, 1 bar,
      rsrp -105, sinr 3; card.usage.get after the first session 15989 bytes
      sent, 17964 received.
      NOTE-MBGLW, 2026-11-03:
      notecard-probe (commissioning/notecard-probe at 6f3c35d, IDF v6.0.2,
      PROBE_PRODUCT org.solch.solchjg:field_data_monitor, sync and GPS off) on
      the board with MAC 48:27:e2:ea:48:3c, 2026-11-03 ~01:33Z: scan 0x17 0x6a
      0x76 (0x48 absent, no water board fitted); start ESP_OK; card.version
      notecard-11.4.1.17828, NOTE-MBGLW, board 5.13; every request answered in
      105 - 156 ms; hub.get product as set, periodic, outbound 60, inbound
      1440; card.transport cell (was wifi-cell); note.add to probe.qo of 100
      readings (9207-byte body) 6890 ms and of 50 (4607 bytes) 3385 ms, both
      accepted; card.wireless LTE band 2, 1 bar, rsrp -117, sinr 2. card.time
      {no-time} before the first sync. Without a ProductUID note.add is
      refused with {product-noexist}. Shipped firmware with uplink=cell on the
      same board, 2026-11-03: ca3569e logged "time synced
      ... src=cell", and its quick test's alert "cell note alert n=1" with no
      L44; 1e6c27d booted with no E lines (no i2c.master error) and its gps
      test passed 1 s in on the location the Notecard held; 647ff02, with
      FR-33.16's fresh-fix rule, logged "GPS searching 00:01" counting up and
      L45 with a new fix 56 s in (about 300 m from the held place), then
      "test end id=gps fix=yes result=pass".
    consequence: >
      The 100-reading batch fits NFR-33.1's 10 s at 100 kHz, so FR-33.7 keeps
      notes of 100 readings. The device at 0x6a is the Notecarrier-X's LiPo
      charger, a TI BQ25628E at a fixed address on the Notecard's I2C lines
      (Blues' answer to the user, 2026-11-03); it clashes with nothing on the
      bus. The bench stands inside,
      near a window: the signal (1 bar) is marginal and a GPS fix may be slow or
      fail there, so sync timing and GPS results on the bench are read with
      that in mind; place AE1 per the User Manual 5g and AE2 on the glass. A GPS
      fix at the window comes within about a minute, so the gps test (TC-CELL-14)
      can run on the bench. card.location answers with the held location, which
      is why FR-33.16 counts only a fix newer than the search.
  dut-rtc:
    what: An Adafruit RV-8803 breakout (0x32) with a CR1220 on the sensor bus (GPIO 43/44) of the board in SLOT1, through the Qwiic star (FSD §39.2)
    available: unproven
    consequence: >
      Not yet fitted. commissioning/rtc-probe is its first run (NFR-39.1 and
      the trim's direction); TC-RTC-10 and later need it.
  seam-sensor-fault-build:
    what: "Test build that reads the sensor at an address where nothing answers, 0x76 and 0x77 both replaced (FSD §23.4, FR-23.1)"
    available: no
    consequence: >
      Not built yet; TC-WX-12 is blocked until it is.
  ntfy-server:
    what: "The user's ntfy test server at http://192.168.2.231 (port 80), reachable from the bench AP network and from the test host"
    available: unproven
    consequence: >
      R-28; TC-NTFY-20 is its first run. If the bench AP cannot route to
      it, the bench rows are blocked (testbench change request) and run by
      the operator with the DUT on the user's own WiFi.
  operator-at-bench:
    what: A person at the bench answers operator prompts and can see the AMOLED panel, held USB-C to the right
    available: yes
    observed: 2026-10-29
    evidence: >
      lcd-probe prompt "Human confirmed" 22:31:40Z.
    consequence: >
      An answer counts only when given on the Pi display and the bench logs
      "Human confirmed". Orientation must be stated as the USB-C cable side.

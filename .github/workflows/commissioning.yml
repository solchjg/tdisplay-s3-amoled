name: Commissioning aids

# Builds the Phase 2 debugging programs under commissioning/. They are not
# product firmware and are never released.

on:
  push:
    branches: [main]
    paths: ['commissioning/**', 'shared', '.github/workflows/commissioning.yml']
  pull_request:
    paths: ['commissioning/**', 'shared', '.github/workflows/commissioning.yml']
  workflow_dispatch:
    inputs:
      notecard_product:
        description: 'notecard-probe only: Notehub ProductUID (PROBE_PRODUCT); empty leaves the Notecard alone'
        required: false
        default: ''
      notecard_sync:
        description: 'notecard-probe only: force one sync (PROBE_SYNC; uses cellular data)'
        type: boolean
        default: false
      notecard_gps:
        description: 'notecard-probe only: seek one GPS fix (PROBE_GPS)'
        type: boolean
        default: false
      modem_apn:
        description: 'modem-probe only: APN of the SIM (PROBE_APN)'
        required: false
        default: 'iot.1nce.net'
      modem_tb_url:
        description: 'modem-probe only: ThingsBoard base URL (the token comes from the settings image); empty skips'
        required: false
        default: ''
      modem_ntfy:
        description: 'modem-probe only: ntfy base URL (topic and token come from the settings image); empty skips'
        required: false
        default: ''
      modem_tests:
        description: 'modem-probe only: any of gps, psm, sh1106, fallback (space separated; fallback makes modem_plmn a preference)'
        required: false
        default: ''
      modem_every:
        description: 'modem-probe only: minutes between runs, 0 runs once (PROBE_EVERY_MIN)'
        required: false
        default: '0'
      modem_plmn:
        description: 'modem-probe only: network to lock to, MCC+MNC such as 310260 (PROBE_PLMN); empty is automatic'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      matrix:
        program: [forward-path, lcd-probe, wifi-probe, button-probe, loop-probe, notecard-probe, epaper-probe, modem-probe]
    defaults:
      run:
        shell: bash
        working-directory: commissioning/${{ matrix.program }}
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true   # lcd-probe, loop-probe, notecard-probe, epaper-probe and modem-probe build shared components
      # forward-path uses the product's own table (C-10.6), named relative to
      # the project directory; the others ignore the copy.
      - name: Use the shipped partition table
        run: cp "$GITHUB_WORKSPACE/partitions.csv" .
      - name: Probe options (workflow_dispatch)
        if: matrix.program == 'notecard-probe' && github.event_name == 'workflow_dispatch'
        env:
          PRODUCT: ${{ inputs.notecard_product }}
          SYNC: ${{ inputs.notecard_sync }}
          GPS: ${{ inputs.notecard_gps }}
        run: |
          case "$PRODUCT" in *[!A-Za-z0-9.:_-]*) echo "FATAL: ProductUID has characters outside FSD 33.3"; exit 1;; esac
          { echo "CONFIG_PROBE_PRODUCT=\"$PRODUCT\""
            [ "$SYNC" = true ] && echo "CONFIG_PROBE_SYNC=y"
            [ "$GPS" = true ] && echo "CONFIG_PROBE_GPS=y"
            true; } >> sdkconfig.defaults
          cat sdkconfig.defaults
      - name: Probe options (workflow_dispatch)
        if: matrix.program == 'modem-probe' && github.event_name == 'workflow_dispatch'
        env:
          APN: ${{ inputs.modem_apn }}
          TB_URL: ${{ inputs.modem_tb_url }}
          NTFY: ${{ inputs.modem_ntfy }}
          TESTS: ${{ inputs.modem_tests }}
          EVERY: ${{ inputs.modem_every }}
          PLMN: ${{ inputs.modem_plmn }}
        # The repo is public, so builds carry no secrets: the ThingsBoard token
        # and the ntfy topic and token come from a settings image flashed at
        # 0x9000 (commissioning/modem-probe/settings.csv.example), kept off git.
        run: |
          plain() { case "$1" in *[!A-Za-z0-9.:/_-]*) echo "FATAL: $2 has unexpected characters"; exit 1;; esac; }
          read -r NTFY_URL NTFY_EXTRA <<< "$NTFY"
          if [ -n "$NTFY_EXTRA" ]; then echo "FATAL: modem_ntfy takes only the base URL; the topic belongs in the settings image"; exit 1; fi
          plain "$APN" APN; plain "$TB_URL" modem_tb_url; plain "$NTFY_URL" ntfy_url
          case "$EVERY" in ''|*[!0-9]*) echo "FATAL: modem_every is not a number"; exit 1;; esac
          case "$PLMN" in ''|[0-9][0-9][0-9][0-9][0-9]|[0-9][0-9][0-9][0-9][0-9][0-9]) ;; *) echo "FATAL: modem_plmn is not 5 or 6 digits"; exit 1;; esac
          { echo "CONFIG_PROBE_APN=\"$APN\""
            echo "CONFIG_PROBE_TB_URL=\"$TB_URL\""
            echo "CONFIG_PROBE_NTFY_URL=\"$NTFY_URL\""
            echo "CONFIG_PROBE_EVERY_MIN=$EVERY"
            echo "CONFIG_PROBE_PLMN=\"$PLMN\""
            for t in $TESTS; do
              case "$t" in gps) echo "CONFIG_PROBE_GPS=y";; psm) echo "CONFIG_PROBE_PSM=y";;
                sh1106) echo "CONFIG_PROBE_OLED_SH1106=y";;
                fallback) echo "CONFIG_PROBE_PLMN_FALLBACK=y";;
                *) echo "FATAL: unknown modem test $t" >&2; exit 1;; esac
            done; } >> sdkconfig.defaults
          cat sdkconfig.defaults
      - name: Build
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
      - name: No secret in the image
        if: matrix.program == 'modem-probe'
        env:
          TB_TOKEN: ${{ secrets.MODEM_PROBE_TB_TOKEN }}
        run: |
          if [ -n "$TB_TOKEN" ] && grep -qaF "$TB_TOKEN" build/*.bin; then
            echo "FATAL: the ThingsBoard token is in the image"; exit 1
          fi
      - name: Collect flash set from flash_args
        run: |
          mkdir -p out
          cp build/flash_args out/
          awk '$1 ~ /^0x/ {print $2}' build/flash_args | while read -r f; do
            cp "build/$f" out/ || { echo "FATAL: missing build/$f"; exit 1; }
          done
          ls -l out; cat out/flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.program }}
          path: commissioning/${{ matrix.program }}/out/

  # Hand-started builds go to the firmware-drops branch as one commit that
  # replaces the last, so a session that can fetch git but not artifact
  # storage can flash them. Only safe because the images carry no secrets.
  drop:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: drops
      - name: Push to firmware-drops
        env:
          INPUTS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd drops
          { echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "inputs: $INPUTS"; } > BUILD.txt
          git init -q -b firmware-drops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Probe builds of $GITHUB_SHA (run $GITHUB_RUN_ID)"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" firmware-drops

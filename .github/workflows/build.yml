name: Build Firmware

# build    — every push to main, every pull request, every v*.*.* tag, manual dispatch
# verify   — tags only: flash THIS run's bytes to the testbench and run the
#            journey (JRN-01) on the self-hosted runner in the devcontainer
# release  — tags only, and only after verify is green: red journey = no release

env:
  IDF_TAG: v6.0.2          # keep in step with the container tag below (FSD C-10.2)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      # Container runs as root, workspace belongs to the runner user: without
      # this, every git call after checkout dies with "dubious ownership".
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags are needed for the version
          submodules: true   # shared/ holds the reusable components

      - name: Show the IDF version actually used
        run: . $IDF_PATH/export.sh >/dev/null && idf.py --version

      - name: Decide the version
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building $VERSION"

      # -DSDKCONFIG keeps the generated config in the build dir, so a stray
      # root sdkconfig can never outrank sdkconfig.defaults.
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig \
                -DPROJECT_VER=${{ steps.plan.outputs.version }}"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build

      - name: Check the image fits a 4 MB OTA slot (FSD C-10.7)
        run: |
          SIZE=$(stat -c %s build/tdisplay_webserver.bin)
          echo "app image: $SIZE bytes"
          [ "$SIZE" -le 4194304 ] || { echo "FATAL: image exceeds 4 MB"; exit 1; }

      # FR-35.5: the cellular build's modem parts stay out of this build.
      - name: Check the modem components are not in the T-Display build (FR-35.5)
        run: |
          if grep -E '^CONFIG_ESP_MODEM_' build/sdkconfig; then
            echo "FATAL: esp_modem options in the T-Display sdkconfig"; exit 1
          fi
          python3 - <<'PY'
          import json
          c = json.load(open("build/project_description.json"))["build_components"]
          bad = sorted(set(c) & {"sim7080", "sim7670", "max17048", "axp2101", "modem_link",
                                 "espressif__esp_modem"})
          print("modem components in the T-Display build:", bad or "none")
          raise SystemExit(1 if bad else 0)
          PY

      # Host-tier inspection of this build (FSD C-10.1 – C-10.3, C-10.6 – C-10.8, FR-9.2);
      # in ci.yml these tests skip for want of a build.
      - name: Inspect the build (tests/host/test_build.py)
        run: |
          . $IDF_PATH/export.sh >/dev/null
          python -m pip install -q 'pytest==8.*'
          BUILD_OUTPUT=build python -m pytest tests/host/test_build.py -v -rs -p no:cacheprovider

      - name: Collect artefacts
        run: |
          V="${{ steps.plan.outputs.version }}"
          cp build/tdisplay_webserver.bin firmware_v${V}.bin
          cp build/tdisplay_webserver.elf firmware_v${V}.elf
          # Cold-flash set taken from flash_args, never hand-written.
          mkdir -p coldflash
          cp build/flash_args coldflash/
          awk '$1 ~ /^0x/ {print $2}' build/flash_args | while read -r f; do
            cp "build/$f" coldflash/ || { echo "FATAL: missing build/$f"; exit 1; }
          done
          cp build/sdkconfig sdkconfig.generated
          cp dependencies.lock dependencies.lock.generated 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-v${{ steps.plan.outputs.version }}
          path: |
            firmware_v*.bin
            firmware_v*.elf
            sdkconfig.generated
            dependencies.lock.generated
            coldflash/

  # LCD fault-injection test builds (FSD §5.6): test artefacts for the
  # negative tests. `release` never downloads them.
  lcd-fault:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      matrix:
        variant: [init, write5]
    defaults:
      run:
        shell: bash
        working-directory: tests/target/lcd_fault
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The shipped sdkconfig.defaults names partitions.csv relative to the
      # project directory; the test build uses the shipped table (C-10.9).
      - name: Use the shipped partition table
        run: cp "$GITHUB_WORKSPACE/partitions.csv" .
      - name: Build
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig \
                -DSDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults;$PWD/sdkconfig.${{ matrix.variant }}"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
          grep -E 'CONFIG_LCD_FAULT_' build/sdkconfig
      - name: Collect flash set from flash_args
        run: |
          mkdir -p out
          cp build/flash_args out/
          awk '$1 ~ /^0x/ {print $2}' build/flash_args | while read -r f; do
            cp "build/$f" out/ || { echo "FATAL: missing build/$f"; exit 1; }
          done
          cat out/flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: lcdfault-${{ matrix.variant }}
          path: tests/target/lcd_fault/out/

  # No-network test build (FSD §5.6, FR-5.24): rollback test artefact, never released.
  no-network:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
        working-directory: tests/target/no_network
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use the shipped partition table
        run: cp "$GITHUB_WORKSPACE/partitions.csv" .
      - name: Build
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig \
                -DSDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
      - uses: actions/upload-artifact@v4
        with:
          name: nonetwork
          path: tests/target/no_network/build/tdisplay_webserver_nonetwork.bin

  # Hang test builds (FSD §19.3, FR-19.1/19.2): watchdog test artefacts, never released.
  hang:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      matrix:
        variant: [app, http]
    defaults:
      run:
        shell: bash
        working-directory: tests/target/hang
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use the shipped partition table
        run: cp "$GITHUB_WORKSPACE/partitions.csv" .
      - name: Build
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig -DHANG_VARIANT=${{ matrix.variant }} \
                -DSDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
      - name: Collect flash set from flash_args
        run: |
          mkdir -p out
          cp build/flash_args out/
          awk '$1 ~ /^0x/ {print $2}' build/flash_args | while read -r f; do
            cp "build/$f" out/ || { echo "FATAL: missing build/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hang-${{ matrix.variant }}
          path: tests/target/hang/out/

  # Sleep test builds (FSD §21.3): deep-sleep test artefacts, never released.
  sleep:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      matrix:
        period: [10, 300]
    defaults:
      run:
        shell: bash
        working-directory: tests/target/sleep
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use the shipped partition table
        run: cp "$GITHUB_WORKSPACE/partitions.csv" .
      - name: Build
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig -DSLEEP_S=${{ matrix.period }} \
                -DSDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
      - name: Collect flash set from flash_args
        run: |
          mkdir -p out
          cp build/flash_args out/
          awk '$1 ~ /^0x/ {print $2}' build/flash_args | while read -r f; do
            cp "build/$f" out/ || { echo "FATAL: missing build/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sleep-${{ matrix.period }}
          path: tests/target/sleep/out/

  mail-fast:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
        working-directory: tests/target/mail_fast
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use the shipped partition table
        run: cp "$GITHUB_WORKSPACE/partitions.csv" .
      - name: Build
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build -DSDKCONFIG=$PWD/build/sdkconfig \
                -DSDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
      - name: Collect flash set from flash_args
        run: |
          mkdir -p out
          cp build/flash_args out/
          awk '$1 ~ /^0x/ {print $2}' build/flash_args | while read -r f; do
            cp "build/$f" out/ || { echo "FATAL: missing build/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mail-fast
          path: tests/target/mail_fast/out/

  # Waveshare ESP32-S3-SIM7670G-4G build (FSD §35, FR-35.5): the same sources for the other board.
  ws7670g:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
    steps:
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build-ws -DSDKCONFIG=$PWD/build-ws/sdkconfig \
                -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ws7670g"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
      - name: Check the image fits a 4 MB OTA slot (FSD C-10.7, FR-35.5)
        run: |
          SIZE=$(stat -c %s build-ws/tdisplay_webserver.bin)
          echo "app image: $SIZE bytes"
          [ "$SIZE" -le 4194304 ] || { echo "FATAL: image exceeds 4 MB"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ws7670g
          path: |
            build-ws/flash_args
            build-ws/bootloader/bootloader.bin
            build-ws/partition_table/partition-table.bin
            build-ws/ota_data_initial.bin
            build-ws/tdisplay_webserver.bin
      # FR-35.22: the bench stand-in (the 1.3" OLED on the sensor bus), with
      # everything a first flash needs; never released.
      - name: Build the bench stand-in
        run: |
          . $IDF_PATH/export.sh >/dev/null
          ARGS="-B build-standin -DSDKCONFIG=$PWD/build-standin/sdkconfig \
                -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.ws7670g;sdkconfig.standin"
          idf.py $ARGS set-target esp32s3
          idf.py $ARGS build
      - uses: actions/upload-artifact@v4
        with:
          name: ws7670g-standin
          path: |
            build-standin/flash_args
            build-standin/bootloader/bootloader.bin
            build-standin/partition_table/partition-table.bin
            build-standin/ota_data_initial.bin
            build-standin/tdisplay_webserver.bin

  verify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, testbench]     # runner inside .devcontainer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: firmware-v${{ needs.build.outputs.version }}
          path: artifact
      # An unreachable bench is an unmet precondition: fail here with the
      # reason, publish nothing, re-run once the bench is powered.
      - name: Bench reachable
        run: curl -fsS --max-time 10 "$TESTBENCH_URL/api/info"
        env:
          TESTBENCH_URL: http://192.168.2.230:8080
      # A skipped step is `not done`, which is not a pass: the release needs
      # every JRN-01 step declared in the plan to have run and passed.
      - name: Journey on the released bytes
        run: |
          pytest tests/bench -m journey -q -rs --junitxml=journey.xml
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          plan = open("testing/test-plan.yaml").read()
          want = len(re.findall(r"^\s*- id: JRN-01\.", plan, re.M))
          s = ET.parse("journey.xml").getroot()
          s = s if s.tag == "testsuite" else s.find("testsuite")
          ran = int(s.get("tests")) - int(s.get("skipped")) - int(s.get("failures")) - int(s.get("errors"))
          print(f"journey: {ran} passed of {want} declared")
          assert int(s.get("skipped")) == 0, "a journey step was skipped (not done)"
          assert ran == want, "journey incomplete"
          PY
        env:
          TESTBENCH_URL: http://192.168.2.230:8080
          FIRMWARE_DIR: ${{ github.workspace }}/artifact/coldflash

  release:
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-v${{ needs.build.outputs.version }}
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            firmware_v*.bin
            firmware_v*.elf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
